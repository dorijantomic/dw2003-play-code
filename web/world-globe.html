<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Globe — DW2003</title>
<style>
  html, body { margin:0; height:100%; background:#05070d; color:#cfd8ea; font:13px monospace; overflow:hidden; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #cv.drag { cursor:grabbing; }
  #side { position:fixed; top:10px; left:10px; width:290px; max-height:calc(100vh - 20px); overflow-y:auto; box-sizing:border-box;
          padding:10px; background:rgba(14,16,28,.86); border:1px solid #2a3050; }
  h3 { margin:0 0 6px; color:#8cf; }
  .dim { color:#678; font-size:11px; }
  #status { color:#9ab; font-size:11px; white-space:pre-wrap; margin-top:6px; }
  #tip { position:fixed; pointer-events:none; display:none; padding:3px 7px; background:rgba(10,12,20,.92); border:1px solid #58a; color:#fff; white-space:nowrap; }
  #info { margin-top:8px; padding-top:6px; border-top:1px solid #2a3050; white-space:pre-wrap; }
  .sw { display:inline-block; width:10px; height:10px; margin-right:5px; vertical-align:-1px; }
  label { user-select:none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="side">
  <h3>World Globe</h3>
  <div class="dim">Every open-air field map stitched into one world from the maps' own exits, on a globe.
    Drag = turn, wheel = zoom, hover = map name, click = details. Yellow dots = buildings and dungeons behind a door.</div>
  <div style="margin-top:6px"><label><input id="pins" type="checkbox" checked> door pins (interior maps)</label></div>
  <div id="legend" style="margin-top:6px"></div>
  <div id="status">loading...</div>
  <div id="info"></div>
</div>
<div id="tip"></div>
<script type="importmap">{"imports":{"three":"./lib3d/three.module.js"}}</script>
<script type="module" src="world-globe.js"></script>
</body>
</html>
