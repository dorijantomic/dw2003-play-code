<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed Save</title>
<style>
  body { background:#1d1d2b; color:#e8e8f0; font:15px/1.6 "Segoe UI",system-ui,sans-serif; margin:0; padding:24px 16px; }
  main { max-width:560px; margin:auto; }
  button { background:#2a2a40; color:#e8e8f0; border:1px solid #45456a; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; margin:4px 0; }
  .small { font-size:13px; color:#b8b8cc; }
</style>
</head>
<body>
<main>
  <h1>Seed my save</h1>
  <p>Gives this browser save Digimon partners, then opens the game. Your current save is backed up first; the last
    button puts it back. Debug page (same save keys as <code>try-partner.html</code>).</p>
  <button id="seed">Party Agumon, Veemon, Guilmon + all 8 starters obtained (the rest wait in the Digimon Lab)</button>
  <button id="restore" class="small">Put my own save back</button>
  <p id="msg" class="small"></p>
</main>
<script>
  // Roster slots 0..7 = ROSTER_SLOT_CHARIDS (web/vendor/engine.js); digimon id = slot + 1 (web/party.js CHARID_TO_DIGID).
  const SLOTS = ["p003pken", "p004kogu", "p005koet", "p006agum", "p007vmon", "p008giru", "p009rena", "p010pata"];
  const PARTY = ["p006agum", "p007vmon", "p008giru"];
  const KEYS = ["fieldLocation", "charId", "party", "partnerStats", "partyStats", "equipment", "reserveStats",
    "reserveEquipment", "rosterOwned", "playerName"];
  const BACKUP = "seedSaveBackup";
  const msg = (t) => { document.getElementById("msg").textContent = t; };
  const store = (() => { try { return window.localStorage; } catch { return null; } })();
  // the same level-1 block a freshly recruited member gets (web/party.js baseStatsFor)
  const base = (p) => ({ digimonId: p.id, level: 1, xp: 0, hp: p.hp, maxHp: p.hp, mp: p.mp, maxMp: p.mp, bonuses: {}, elemBonuses: {} });
  document.getElementById("seed").addEventListener("click", async () => {
    if (!store) return msg("This browser blocks site storage, so the save cannot be seeded.");
    const db = (await (await fetch("assets/data/digimon.json")).json()).digimon;
    const stats = (charId) => base(db.find((d) => d.id === SLOTS.indexOf(charId) + 1));
    if (!store.getItem(BACKUP)) store.setItem(BACKUP, JSON.stringify(Object.fromEntries(KEYS.map((k) => [k, store.getItem(k)]))));
    const reserve = Object.fromEntries(SLOTS.filter((c) => !PARTY.includes(c)).map((c) => [c, stats(c)]));
    store.setItem("playerName", store.getItem("playerName") || "Junior");
    const hadPlace = !!store.getItem("fieldLocation");
    if (!hadPlace) store.setItem("fieldLocation", JSON.stringify({ version: 1, mapId: "s245", x: 332, y: 390, dir: "left" }));
    store.setItem("charId", PARTY[0]);
    store.setItem("party", JSON.stringify(PARTY));
    store.setItem("partnerStats", JSON.stringify(stats(PARTY[0])));
    store.setItem("partyStats", JSON.stringify(PARTY.map(stats)));
    store.setItem("equipment", JSON.stringify(PARTY.map(() => ({}))));
    store.setItem("reserveStats", JSON.stringify(reserve));
    store.setItem("reserveEquipment", JSON.stringify({}));
    store.setItem("rosterOwned", String(0xff));
    location.href = hadPlace ? "index.html?skipTitle=1" : "index.html?skipTitle=1&map=s245";
  });
  document.getElementById("restore").addEventListener("click", () => {
    const saved = store && store.getItem(BACKUP);
    if (!saved) return msg("Nothing to put back: this page has not seeded the save.");
    for (const [k, v] of Object.entries(JSON.parse(saved))) v == null ? store.removeItem(k) : store.setItem(k, v);
    store.removeItem(BACKUP);
    msg("Your own save is back.");
  });
</script>
</body>
</html>
