  </div>

  <!-- Status indicators -->
  <div id="status">
    <span><span class="dot" id="dot-webgl"></span>WebGL: <span id="st-webgl">checking…</span></span>
    <span><span class="dot" id="dot-offscreen"></span>OffscreenCanvas: <span id="st-offscreen">checking…</span></span>
    <span><span class="dot" id="dot-renderer"></span>renderer3d: <span id="st-renderer">–</span></span>
    <span><span class="dot" id="dot-model"></span>model loaded: <span id="st-model">–</span></span>
    <span><span class="dot" id="dot-frames"></span>frames: <span id="st-frames">0</span></span>
  </div>

  <!-- Inline WebGL sanity check: red triangle should appear here immediately -->
  <div style="color:#aaa;font-size:11px;">WebGL sanity (should be red triangle):</div>
  <canvas id="gltest" width="160" height="80"></canvas>

  <canvas id="c" width="640" height="480"></canvas>
  <div id="log"></div>

<script type="module">
import { autoFilterable, injectFilterStyles } from "./lab-filter.js";
import { createBattle } from "./battle.js";
import { createBattle3D, resolveModelFolder } from "./battle3d.js";
import { ITEMS, ITEM_BY_ID } from "./vendor/engine.js";

// battle.js reads usable items through this global (same as game.js wires it).
window.__ITEM_BY_ID = ITEM_BY_ID;

// Fixture knobs for the bounded technique-cost check (see
// tools/verify_tech_mp_cost.mjs). They seed the persistent roster state only;
// after Start, every step is an ordinary battle button.
const LAB_QUERY = new URLSearchParams(location.search);

// ── Battle data (digimon profiles + skills + evolution chains) ─────────────────
// Loaded once; drives the form dropdown, tech readout, and the player's resolved profile.
let DIGI_DB = {};      // id -> profile
let NAME2ID = {};      // profile name -> id
let SKILL_DB = {};     // skill id -> skill
let EVO = [];          // the disc's eight trees, one per roster slot
// model_map still uses a few names that differ from digimon.json:
const FORM_NAME_ALIAS = {
  BKWarGreymon: "BK WarGreymon", ImperialdramonFM: "Imperialdramon-F", ImperialdramonPM: "Imperialdramon-P",
};
const profileName = (evoName) => FORM_NAME_ALIAS[evoName] ?? evoName;

async function loadBattleData() {
  const [dj, evj] = await Promise.all([
    fetch("assets/data/digimon.json").then(r => r.json()),
    fetch("assets/data/evolutions.json").then(r => r.json()),
  ]);
  DIGI_DB  = Object.fromEntries(dj.digimon.map(d => [d.id, d]));
  NAME2ID  = Object.fromEntries(dj.digimon.map(d => [d.name, d.id]));
  SKILL_DB = Object.fromEntries(dj.skills.map(s => [s.id, s]));
  EVO      = evj.lines || [];
}

// Reachable forms for a starter, each tagged with a cumulative "unlock" estimate = the
// shortest-path sum of evolution `level`s from the starter along rookie/standard edges
// (Bellman-Ford relaxation; the graph is small). DNA fusions need two specific parents, so
// they're excluded from the path math and parked at a sentinel — still listed (pick them
// explicitly), never auto-picked by level. Forms with no digimon.json profile are dropped.
const DNA_SENTINEL = 999;
function formsForStarter(starterName) {
  // The disc has eight trees and picks one by ROSTER SLOT (0x8008903C), so this
  // reads the starter's own line rather than a table keyed by name. Rows carry
  // DigimonIds, which is also what the form dropdown and the ledger use.
  const id = NAME2ID[starterName];
  const chain = (EVO[id - 1]?.records) || [];
  const all = new Set([id]);
  const edges = []; // [from, to, level]
  for (const record of chain) {
    all.add(record.to);
    if (!record.req0) edges.push([id, record.to, record.threshold]);
    else if (record.req1) edges.push([record.req1, record.to, record.req1Level]);
    else edges.push([record.req0, record.to, record.req0Level]);
  }
  const cum = { [id]: 1 };
  for (let i = 0; i < all.size; i++) {
    for (const [a, b, lv] of edges) {
      if (cum[a] != null && (cum[b] == null || cum[a] + lv < cum[b])) cum[b] = cum[a] + lv;
    }
  }
  return [...all]
    .map(id2 => ({ name: DIGI_DB[id2]?.name, level: cum[id2] ?? DNA_SENTINEL, id: id2 }))
    .filter(f => f.name != null)
    .sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
}

// Pick the most-evolved form whose unlock level is ≤ the chosen level (else the rookie).
function autoForm(forms, level) {
  let pick = forms[0];
  for (const f of forms) if (f.level <= level) pick = f;
  return pick;
}

function techNames(digId) {
  return (DIGI_DB[digId]?.techs || []).map(t => SKILL_DB[t]?.name ?? `#${t}`);
}

// addLog defined early so IIFEs below can call it; log element looked up lazily
function addLog(msg) {
  const logEl = document.getElementById("log");
  if (logEl) {
    const div = document.createElement("div");
    div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }
  console.log(msg);
}

// ── Inline WebGL sanity test ──────────────────────────────────────────────────
(function sanityTest() {
  const c = document.getElementById("gltest");
  const gl = c.getContext("webgl");
  setSt("webgl", !!gl, gl ? "OK" : "FAILED – no WebGL context");
  if (!gl) return;
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, `attribute vec2 p; void main(){gl_Position=vec4(p,0,1);}`);
  gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, `precision lowp float; void main(){gl_FragColor=vec4(1,0,0,1);}`);
  gl.compileShader(fs);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0.8, -0.8,-0.8, 0.8,-0.8]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  addLog("WebGL sanity: red triangle drawn on small canvas");
})();

// ── OffscreenCanvas test ──────────────────────────────────────────────────────
(function offscreenTest() {
  if (typeof OffscreenCanvas === "undefined") {
    setSt("offscreen", false, "MISSING"); return;
  }
  const oc = new OffscreenCanvas(64, 64);
  const gl = oc.getContext("webgl");
  setSt("offscreen", !!gl, gl ? "OK" : "FAILED – no WebGL on OffscreenCanvas");
  if (gl) addLog("OffscreenCanvas WebGL: OK");
})();

// ── Status helpers ────────────────────────────────────────────────────────────
function setSt(id, ok, text) {
  const dot = document.getElementById(`dot-${id}`);
  const st  = document.getElementById(`st-${id}`);
  if (dot) dot.className = `dot ${ok ? 'ok' : 'err'}`;
  if (st)  st.textContent = text;
}
function setWait(id, text) {
  const dot = document.getElementById(`dot-${id}`);
  const st  = document.getElementById(`st-${id}`);
  if (dot) dot.className = 'dot wait';
  if (st)  st.textContent = text;
}

const STARTERS = {
  1: "p003pken",  // Kotemon
  2: "p004kogu",  // Kumamon
  3: "p005koet",  // Monmon
  4: "p006agum",  // Agumon
  5: "p007vmon",  // Veemon
  6: "p008giru",  // Guilmon
  7: "p009rena",  // Renamon
  8: "p010pata",  // Patamon
};

const DIGIMON = [
  {id:1,name:"Kotemon"},{id:2,name:"Kumamon"},{id:3,name:"Monmon"},
  {id:4,name:"Agumon"},{id:5,name:"Veemon"},{id:6,name:"Guilmon"},
  {id:7,name:"Renamon"},{id:8,name:"Patamon"},{id:9,name:"Dinohumon"},
  {id:10,name:"Hookmon"},{id:11,name:"Grizzmon"},{id:12,name:"Greymon"},
  {id:13,name:"ExVeemon"},{id:14,name:"Growlmon"},{id:15,name:"Kyubimon"},
  {id:16,name:"Angemon"},{id:17,name:"Devimon"},{id:18,name:"Stingmon"},
  {id:19,name:"Angewomon"},{id:20,name:"Kyukimon"},{id:21,name:"Armormon"},
  {id:22,name:"GrapLeomon"},{id:23,name:"MetalGreymon"},{id:24,name:"SkullGreymon"},
  {id:25,name:"Paildramon"},{id:26,name:"WarGrowlmon"},{id:27,name:"Taomon"},
  {id:28,name:"MagnaAngemon"},{id:29,name:"Myotismon"},{id:30,name:"MetalMamemon"},
  {id:31,name:"Kabuterimon"},{id:32,name:"Digitamamon"},{id:33,name:"GuardiAngemon"},
  {id:34,name:"Cannondramon"},{id:35,name:"Marsmon"},{id:36,name:"WarGreymon"},
  {id:37,name:"Imperialdramon"},{id:38,name:"Gallantmon"},{id:39,name:"Sakuyamon"},
  {id:40,name:"Seraphimon"},{id:41,name:"MetalGarurumon"},{id:42,name:"Rosemon"},
  {id:43,name:"BK WarGreymon"},{id:44,name:"Imperialdramon-F"},{id:45,name:"MaloMyotismon"},
  {id:46,name:"MegaGargomon"},{id:47,name:"GranKuwagamon"},{id:48,name:"Phoenixmon"},
  {id:49,name:"Omnimon"},{id:50,name:"Imperialdramon-P"},{id:51,name:"Beelzemon"},
  {id:52,name:"Diaboromon"},{id:53,name:"Agunimon"},{id:54,name:"BladeGarurumon"},
  {id:55,name:"AncientGreymon"},
];

// Populate selects
const playerSel = document.getElementById("playerSel");
const enemySel  = document.getElementById("enemySel");
for (const [id, charId] of Object.entries(STARTERS)) {
  const name = DIGIMON.find(d => d.id === +id)?.name ?? charId;
  const opt = document.createElement("option");
  opt.value = id; opt.textContent = `${name} (id ${id})`;
  playerSel.appendChild(opt);
}
for (const d of DIGIMON) {
  const opt = document.createElement("option");
  opt.value = d.id; opt.textContent = `${d.name} (id ${d.id})`;
  enemySel.appendChild(opt);
}
enemySel.value = "9";

// Type-to-filter the long pickers so reaching one Digimon is not a scroll. The form list is
// short and rebuilt per starter, so it stays a plain dropdown (autoFilterable skips it).
injectFilterStyles();
autoFilterable(document);

const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
let frameCount = 0;

const origError = console.error.bind(console);
console.error = (...args) => { origError(...args); addLog("ERR: " + args.join(" ")); };

// Quick direct test of createBattle3D on a visible canvas to see if it renders
async function testDirectRenderer() {
  addLog("Testing createBattle3D directly on OffscreenCanvas…");
  setWait("renderer", "testing…");
  try {
    if (typeof OffscreenCanvas === "undefined") throw new Error("no OffscreenCanvas");
    const oc = new OffscreenCanvas(320, 224);
    const r = createBattle3D(oc);
    if (!r) { setSt("renderer", false, "createBattle3D returned null"); return; }
    addLog("createBattle3D: OK");

    // Set Agumon vs Dinohumon
    const pFolder = await resolveModelFolder("Agumon");
    const eFolder = await resolveModelFolder("Dinohumon");
    addLog(`Model folders: player=${pFolder}, enemy=${eFolder}`);
    setWait("model", `player=${pFolder}, enemy=${eFolder}`);

    if (pFolder) r.setPlayerDigimon(pFolder);
    if (eFolder) r.setEnemyDigimon(eFolder);

    // Wait 2s for textures and models to load, then blit to the visible canvas
    await new Promise(res => setTimeout(res, 2000));
    addLog("Rendering test frame after 2s load…");
    r.render(0.016);
    const bmp = await oc.transferToImageBitmap();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    addLog("Test frame blitted to canvas — do you see anything?");
    setSt("renderer", true, "rendered (check canvas)");

    // Sample a pixel to detect if anything non-black was drawn
    const px = ctx.getImageData(canvas.width/2, canvas.height/3, 1, 1).data;
    addLog(`Center pixel RGBA: ${px[0]},${px[1]},${px[2]},${px[3]}`);
    if (px[0] < 20 && px[1] < 20 && px[2] < 30) {
      setSt("renderer", false, "rendered but all pixels dark — check model/camera");
    } else {
      setSt("renderer", true, "OK — pixels visible");
    }
  } catch (e) {
    setSt("renderer", false, `THREW: ${e.message}`);
    addLog("createBattle3D test threw: " + e.message);
    console.error(e);
  }
}
testDirectRenderer();

// ── Game state builder ────────────────────────────────────────────────────────
// Stock every item (qty 9) so the in-battle Item menu has a full loadout to test.
// (battle.js's usableItems() shows only the hp/mp/full_hp consumables.)
const TEST_INVENTORY = ITEMS.map(i => ({ id: i.id, qty: 9 }));

function makeState(starterId, playerLevel, formDigId) {
  const charId = STARTERS[starterId];
  const reserves = Object.values(STARTERS).filter((id) => id !== charId).slice(0, 2);
  const hp = 100 + playerLevel * 10;
  const mp = 50 + playerLevel * 5;
  const state = {
    chapter: 1, charIdx: 1, flags: {},
    // digimonId = the resolved evolved form for this level; battle.js prefers it over the starter map.
    manifest: { characters: [null, { id: charId, digimonId: formDigId }] },
    partnerStats: { level: playerLevel, xp: 0, hp, mp, maxHp: hp, maxMp: mp, bonuses: {}, elemBonuses: {} },
    party: [charId, ...reserves],
    partyStats: [null, null, null],
    digimonNames: {},
    inventory: TEST_INVENTORY.map(s => ({ ...s })),
  };
  // Technique-cost fixture: `?tech=<id>&load=0|1&proxy=<0|5|10>`.
  const techId = Number(LAB_QUERY.get("tech") || 0);
  if (techId) {
    const loaned = LAB_QUERY.get("load") === "1";
    const proxy = Number(LAB_QUERY.get("proxy") || 0);
    const ps = state.partnerStats;
    ps.formLedger = [{
      id: formDigId, formLevel: 10, dvexp: 0,
      techSlots: [loaned ? 0 : (0x2000 | techId), 0, 0, 0, 0, 0],
    }];
    ps.equippedForms = [formDigId];
    if (loaned) {
      const ownerId = DIGIMON.find(d => d.id !== formDigId && d.id > 8)?.id ?? 9;
      ps.formLedger.push({ id: ownerId, formLevel: 10, dvexp: 0, techSlots: [0x4000 | techId, 0, 0, 0, 0, 0] });
      ps.equippedForms = [formDigId, ownerId];
    }
    // The battle reads the worn items (state.equipment, through equipmentBonuses),
    // not the cached partnerStats.equipBonuses, so the proxy is worn for real:
    // MPProxy (323, -5) or MPMegaProxy (324, -10) in the first accessory slot.
    if (proxy) {
      const proxyItem = { 5: 323, 10: 324 }[proxy];
      if (!proxyItem) throw new Error(`no MP proxy item cuts ${proxy}`);
      state.equipment = [{ acc0: proxyItem }, {}, {}];
    }
  }
  return state;
}

// The DNA demo's party, built the way a real battle's is. Three roster characters,
// and the two persistent member records the DRI writes: the lead's own species in
// `partnerStats.digimonId` and the reserve's in `partyStats[1].digimonId`. Those
// are the two fields `buildPlayerRoster` reads for the form each member is in
// (web/battle.js:2109-2126), so a `?dna=` pair is set up by the same route
// tools/verify_dna_realplay.mjs's save state uses, not by a lab-only shortcut.
//
// Default Grizzmon + Growlmon (DNA action 433, BladeGarurumon);
// ?dna=Taomon,MagnaAngemon sets up any of the eleven pairs the disc allows.
//
// Each member is named after its own Digimon. `digimonNames[charId]` is the
// player's nickname and the only name the battle has for a party member
// (web/battle.js:2123); while the lab left it empty the HP plate said "Kotemon"
// over a Grizzmon and the Tag line announced "Veemon switches to Growlmon!", so
// a `?dna=` pair looked half-applied — the reserve's new name showed and the
// lead's did not, because neither showed and both came from the starter. The
// rest of the repo already falls back to the current form's name for exactly
// this case (web/dri-model.js:87).
function makeDnaState() {
  const wanted = (new URLSearchParams(location.search).get("dna") ?? "")
    .split(",").map(s => s.trim()).filter(Boolean);
  const digimonByName = (name, fallback) => {
    const found = DIGIMON.find(d => d.name === name);
    // A typo used to fall through to the default pair in silence, which reads as
    // "the ?dna= pair only half-takes". Say so in the log instead.
    if (!found && name) addLog(`?dna=: "${name}" is not a Digimon the lab knows; using ${fallback}`);
    return found ?? DIGIMON.find(d => d.name === fallback);
  };
  const leadDigimon = digimonByName(wanted[0], "Grizzmon");
  const reserveDigimon = digimonByName(wanted[1], "Growlmon");
  const mk = (digimonId, level = 10) => ({
    digimonId, level, xp: 0, hp: 999, mp: 999, maxHp: 999, maxMp: 999,
    bonuses: {}, elemBonuses: {}, equippedForms: [digimonId],
    formLedger: [{ id: digimonId, formLevel: 5, dvexp: 0, techSlots: [] }],
  });
  const lead = mk(leadDigimon.id);
  const reserve = mk(reserveDigimon.id);
  const party = [STARTERS[1], STARTERS[5], STARTERS[2]];
  return {
    chapter: 1, charIdx: 1, flags: {},
    manifest: { characters: [null, { id: party[0], digimonId: leadDigimon.id }] },
    partnerStats: lead,
    party,
    partyStats: [lead, reserve, null],
    digimonNames: {
      [party[0]]: leadDigimon.name,
      [party[1]]: reserveDigimon.name,
    },
    inventory: TEST_INVENTORY.map(s => ({ ...s })),
  };
}

// ── Form dropdown + loadout readout ────────────────────────────────────────────
const formSel = document.getElementById("formSel");

// Repopulate the form dropdown from the chosen starter + level, auto-selecting the form
// the starter has evolved into by that level. Returns the auto-selected form id.
function refreshForms() {
  const starterId   = +playerSel.value;
  const level       = +document.getElementById("playerLevel").value || 1;
  const starterName = DIGIMON.find(d => d.id === starterId)?.name;
  const forms = formsForStarter(starterName);
  formSel.innerHTML = "";
  for (const f of forms) {
    const opt = document.createElement("option");
    opt.value = f.id;
    const tag = f.level >= DNA_SENTINEL ? "DNA" : `Lv≈${f.level}`;
    opt.textContent = `${f.name} (${tag})`;
    formSel.appendChild(opt);
  }
  const auto = autoForm(forms, level);
  if (auto) formSel.value = auto.id;
  updateLoadout();
  return auto?.id;
}

function updateLoadout() {
  const formId = +formSel.value;
  const prof   = DIGI_DB[formId];
  document.getElementById("loadout-form").textContent =
    prof ? `${prof.name} (id ${formId})` : "–";
  document.getElementById("loadout-techs").textContent =
    techNames(formId).join(", ") || "–";
  const usable = ITEMS.filter(i => ["hp", "mp", "full_hp"].includes(i.effect));
  document.getElementById("loadout-items").textContent =
    `${usable.length} usable (${usable.map(i => i.name).join(", ")})`;
}

playerSel.addEventListener("change", refreshForms);
document.getElementById("playerLevel").addEventListener("input", refreshForms);
formSel.addEventListener("change", updateLoadout);

loadBattleData().then(() => {
  refreshForms();
  // Repeatable screenshot/visual-review entry point for the battle-specific
  // UI lab. It still clicks the real createBattle path below—no mock renderer.
  if (new URLSearchParams(location.search).has("autostart")) {
    const screen = new URLSearchParams(location.search).get("screen") ?? "menu";
    setTimeout(() => {
      document.getElementById("startBtn").click();
      setTimeout(() => {
        // `screen=dna` presses NOTHING. The DNA command is five screens deep — the
        // command list, the partner list, the form chooser, the pane's two rows and
        // then the fusion cut-in — and this page's own train could not reach it,
        // because it fires on a clock instead of on the screens appearing: four keys
        // in one task plus five more 120ms apart, the last one ~3.3s after Start,
        // while the pane itself only exists from ~3.8s. Every press was therefore
        // spent on a screen above it, so the pane opened with no key left to press and
        // stayed there (measured, .bunny-scratch/probe10.mjs: the fight reached
        // ST.PLAYER_DNA_CHOICE at 3.8s, sub-state 0, and never left it). Each key is
        // a queued edge the list drains one tick at a time
        // (web/battlecmd-translated.js:149-166), and that queue is shared with any
        // other hand on the pad, so a walker's own presses landed on top of these
        // ones. The fight now starts and stops on the command menu: walk it with
        // Circle yourself, or let tools/verify_dna.mjs drive the whole beat with real
        // key presses.
        const hands = screen === "dna" ? "menu" : screen;
        const index = { menu: 0, tech: 1, tag: 3, taganim: 3, item: 4 }[hands] ?? 0;
        for (let i = 0; i < index; i++) battle?.handleKey("arrowdown");
        // `blast` stays on the idle menu: the transformation is triggered
        // directly below, so pressing confirm here would start an attack first.
        const noConfirm = new Set(["menu", "blast", "manualdv", "revert"]);
        if (!noConfirm.has(hands)) battle?.handleKey("enter");
        if (screen === "taganim") {
          // Repeatable real-flow visual check: first reserve, first available
          // form, then acknowledge sequence 0x38's input-gated prompt.
          setTimeout(() => battle?.handleKey("enter"), 120);
          setTimeout(() => battle?.handleKey("enter"), 240);
          setTimeout(() => battle?.handleKey("enter"), 3000);
        } else if (screen === "manualdv") {
          // Manual DV (sequence 0x37 + the per-Digimon sequence on object 0x4e).
          setTimeout(() => window.__battleDv?.(), 200);
        } else if (screen === "revert") {
          // Blast revert (sequence 0x62), the de-digivolution program.
          setTimeout(() => window.__battleRevert?.(), 200);
        } else if (screen === "blast") {
          // Blast digivolution (sequence 0x61). Runs the real triggerBlast the
          // saturated-gauge path calls; the gauge itself is not reachable in a
          // fixed-length headless capture.
          setTimeout(() => window.__battleBlast?.(), 200);
        } else if (screen === "dna") {
          addLog("DNA party: " + (LAB_QUERY.get("dna") ?? "Grizzmon,Growlmon")
            + " — Circle is Tag, then Circle the partner, Circle its form, Circle the"
            + " names, Down to DNA DV, Circle. tools/verify_dna.mjs walks it.");
        }
      }, 2600);
    }, 100);
  }
}).catch(e => addLog("data load failed: " + e.message));

let battle = null;
let state  = makeState(1, 5, 1);   // placeholder until Start (re)builds with the chosen form
let lastTime = null;
let animId   = null;

function loop(ts) {
  animId = requestAnimationFrame(loop);
  // Clamp at 250ms (was 100): a heavy fullscreen canvas can render below 10fps,
  // and the old clamp put the whole sim into slow motion instead of catching up.
  const dt = lastTime == null ? 0 : Math.min((ts - lastTime) / 1000, 0.25);
  lastTime = ts;
  if (battle?.isActive()) {
    battle.update(dt);
    battle.draw();
    frameCount++;
    if (frameCount % 60 === 0) {
      document.getElementById("st-frames").textContent = frameCount;
    }
  }
}

document.getElementById("startBtn").addEventListener("click", () => {
  const starterId    = +playerSel.value;
  const playerLevel  = +document.getElementById("playerLevel").value;
  const formDigId    = +formSel.value || starterId;
  const enemyId      = +document.getElementById("enemySel").value;
  const enemyLevel   = +document.getElementById("enemyLevel").value;

  const dnaDemo = new URLSearchParams(location.search).get("screen") === "dna";
  state = dnaDemo ? makeDnaState() : makeState(starterId, playerLevel, formDigId);
  window.__battleTestState = state;
  if (!battle) battle = createBattle(canvas, ctx, () => state);
  window.__battleTest = battle;

  const pName = DIGI_DB[formDigId]?.name ?? DIGIMON.find(d => d.id === starterId)?.name;
  const eName = DIGIMON.find(d => d.id === enemyId)?.name;
  addLog(`Starting: ${pName} lv${playerLevel} (techs: ${techNames(formDigId).join(", ")}) vs ${eName} lv${enemyLevel}`);
  setWait("model", "loading…");

  battle.start({
    enemyId, enemyLevel,
    onWin:  () => { addLog("** WIN **");  setSt("model", true, "WIN"); },
    onFlee: () => { addLog("** FLED **"); setSt("model", true, "FLED"); },
    onLose: () => { addLog("** LOSE **"); setSt("model", true, "LOSE"); },
  });

  if (!animId) loop(performance.now());
});

// Battle-specific UI lab shortcut: render the real STFGTREP code path without
// requiring a lethal attack replay. This seeds three evolution slots per pack
// member solely in the lab state; production progression remains untouched.
document.getElementById("victoryBtn").addEventListener("click", async () => {
  const starterId = +playerSel.value;
  const playerLevel = +document.getElementById("playerLevel").value;
  const formDigId = +formSel.value || starterId;
  const enemyId = +document.getElementById("enemySel").value;
  const enemyLevel = +document.getElementById("enemyLevel").value;
  state = makeState(starterId, playerLevel, formDigId);
  window.__battleTestState = state;
  if (!battle) battle = createBattle(canvas, ctx, () => state);
  window.__battleTest = battle;
  await battle.start({ enemyId, enemyLevel, onWin() {}, onFlee() {}, onLose() {} });
  const b = window.__battleB?.();
  if (!b) return;
  for (const member of b.playerRoster) {
    const rookieName = DIGI_DB[member.rookieId]?.name;
    const ids = formsForStarter(rookieName).map((form) => form.id).filter((id) => id > 8).slice(0, 3);
    member.stats.equippedForms = ids;
    member.stats.formLedger = ids.map((id, i) => ({ id, formLevel: Math.max(1, 3 - i), dvexp: 0, techSlots: [] }));
  }
  // No screenId here (development harness only): the results screen reads the disc's
  // record for battle id 0, which is all-zero, so this preview shows 0 EXP / 0 BIT.
  b.state = 8;
  b.message = "Battle Won!";
  b._victoryPhase = "report";
  b._winPageIndex = 0;
  b.timer = 2;
  if (!animId) loop(performance.now());
});

window.addEventListener("keydown", e => {
  // handleKey expects lowercased keys ("arrowright", "enter") — same normalization game.js does.
  if (battle?.isActive()) { battle.handleKey(e.key.toLowerCase()); e.preventDefault(); }
});

addLog("Ready. Check status row above, then Start Battle.");
</script>
