<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;image-rendering:auto}
</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import { createBattle3D, resolveModelFolder } from "./battle3d.js";
const cv = document.getElementById("c");
const dpr = Math.min(devicePixelRatio||1, 2);
cv.width  = Math.round(innerWidth  * dpr);
cv.height = Math.round(innerHeight * dpr);
const r = createBattle3D(cv);
window.__r = r;
window.__setMode = m => r.setCameraMode(m);
if (r) {
  const p = (location.hash.match(/p=([a-z0-9]+)/)||[])[1] || "m373rena";
  const e = (location.hash.match(/e=([a-z0-9]+)/)||[])[1] || "m222wood";
  r.setPlayerDigimon(p);
  r.setEnemyDigimon(e);
  let last = performance.now();
  function loop(t){ const dt=Math.min((t-last)/1000,0.05); last=t; r.render(dt); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  window.__ready = true;
}
</script></body></html>
