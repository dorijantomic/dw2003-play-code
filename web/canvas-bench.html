<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas bench (dev)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 6px; top: 6px; z-index: 2; margin: 0; padding: 4px 8px; background: rgba(0,0,0,.7); color: #ffd34d; font: 12px/1.3 ui-monospace, monospace; white-space: pre-wrap; max-width: 60vw; }
  #hud a { color: #8fe08f; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<pre id="hud">canvas-bench: open with #auto to start by itself, or press S. #close closes the window when done.</pre>
<script src="canvas-bench.js"></script>
</body>
</html>
